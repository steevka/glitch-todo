# 5080 stock monitor on deflab (Unraid Compose Manager project "gpu-monitor").
# Code: /mnt/user/appdata/gpu-monitor/app (copied by monitor/deploy.sh), state: .../data.
# Optional Pushover keys go in /mnt/user/appdata/gpu-monitor/monitor.env:
#   PUSHOVER_USER=...   PUSHOVER_TOKEN=...
services:
  gpu-monitor:
    build: /mnt/user/appdata/gpu-monitor/app/monitor
    image: deflab/gpu-monitor:latest
    container_name: gpu-monitor
    init: true
    restart: unless-stopped
    user: "99:100"
    ports:
      - "8787:8787" # LAN + Tailscale: http://deflab:8787
    environment:
      - TZ=America/New_York
      - DATA_DIR=/data
      # Raw requests (MODE=fetch) got the home IP a captcha twice on 2026-11-16, even at
      # 3-4 a minute. Now a real headless Chromium loads the product pages like a person.
      - MODE=browser
      # Prime-only: the plain Prime (the $1,599.99 drops) every other check, the OC/EVO
      # listings in between; one page every 30-45 s.
      - WATCH_TIERS=Prime
      - PRIORITY_ASINS=B0DTPG3B1N
      - SPACING_MS=30000
      - JITTER_MS=15000
      - BLOCK_PAUSE_MIN=360
      # No Amazon requests before this time (lets a flagged IP cool off). Empty = start now.
      - NOT_BEFORE=${NOT_BEFORE:-}
    env_file: /mnt/user/appdata/gpu-monitor/monitor.env
    volumes:
      - /mnt/user/appdata/gpu-monitor/app:/app:ro
      - /mnt/user/appdata/gpu-monitor/data:/data
    shm_size: "512mb" # Chromium needs more than Docker's 64 MB default
    mem_limit: 1g
    logging:
      options:
        max-size: "5m"
        max-file: "2"
