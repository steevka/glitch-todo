# 5080 stock monitor on deflab (Unraid Compose Manager project "gpu-monitor").
# Code: /mnt/user/appdata/gpu-monitor/app (copied by monitor/deploy.sh), state: .../data.
# Optional Pushover keys go in /mnt/user/appdata/gpu-monitor/monitor.env:
#   PUSHOVER_USER=...   PUSHOVER_TOKEN=...
services:
  gpu-monitor:
    image: node:22-alpine
    container_name: gpu-monitor
    init: true
    restart: unless-stopped
    user: "99:100"
    working_dir: /app
    command: ["node", "monitor/monitor.js"]
    ports:
      - "8787:8787" # LAN + Tailscale: http://deflab:8787
    environment:
      - TZ=America/New_York
      - DATA_DIR=/data
      # Prime-only and slow: 3 listings, one request every 20-25 s (each about once a minute).
      # The all-tiers pace (2 s apart) got the home IP a captcha within 6 minutes.
      - WATCH_TIERS=Prime
      - SPACING_MS=20000
      - JITTER_MS=5000
      - BLOCK_PAUSE_MIN=360
      # Wait this long after a (re)start before the first Amazon request. Set to 0 for later restarts.
      - START_DELAY_MIN=${START_DELAY_MIN:-0}
    env_file: /mnt/user/appdata/gpu-monitor/monitor.env
    volumes:
      - /mnt/user/appdata/gpu-monitor/app:/app:ro
      - /mnt/user/appdata/gpu-monitor/data:/data
    mem_limit: 256m
    logging:
      options:
        max-size: "5m"
        max-file: "2"
